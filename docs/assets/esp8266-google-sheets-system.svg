<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">ESP8266 Google Sheets Temperature Logger System</title>
  <desc id="desc">Two DHT22 temperature and humidity sensors connect to an ESP8266, which sends readings over HTTPS using 2.4 GHz Wi-Fi. Google Apps Script timestamps and saves the readings in Google Sheets. Charts are configured separately in the spreadsheet.</desc>

  <defs>
    <style>
      .bg { fill: #0d1117; }
      .card { fill: #161b22; stroke: #30363d; stroke-width: 2; }
      .txt { fill: #f0f6fc; font-family: Inter, Arial, sans-serif; }
      .muted { fill: #8b949e; font-family: Inter, Arial, sans-serif; }
      .line { fill: none; stroke: #8b949e; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .green { stroke: #3fb950; fill: none; }
      .blue { stroke: #58a6ff; fill: none; }
      .orange { stroke: #d29922; fill: none; }
      .cyan { stroke: #39c5cf; fill: none; }
    </style>

    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#8b949e"/>
    </marker>

    <linearGradient id="tempFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0883e" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#f0883e" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="humFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity=".42"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity=".05"/>
    </linearGradient>
  </defs>

  <rect class="bg" width="1200" height="560" rx="18"/>

  <text x="600" y="42" text-anchor="middle" class="txt" font-size="26" font-weight="700">
    ESP8266 → Google Sheets Temperature &amp; Humidity Logger
  </text>
  <text x="600" y="68" text-anchor="middle" class="muted" font-size="14">
    Two-sensor monitoring over 2.4 GHz Wi-Fi with cloud logging and chart visualization
  </text>

  <!-- Stage labels -->
  <g class="muted" font-size="12" font-weight="700" text-anchor="middle">
    <text x="130" y="108">SENSE</text>
    <text x="390" y="108">PROCESS</text>
    <text x="625" y="108">TRANSMIT</text>
    <text x="845" y="108">LOG</text>
    <text x="1065" y="108">VISUALIZE</text>
  </g>

  <!-- Connectors -->
  <g class="line" marker-end="url(#arrow)">
    <path d="M245 195 C290 195 298 230 325 230"/>
    <path d="M245 375 C290 375 298 285 325 285"/>
    <path d="M500 257 H555"/>
    <path d="M695 257 H760"/>
    <path d="M930 257 H970"/>
  </g>

  <!-- Sensor 1 -->
  <g>
    <rect x="35" y="130" width="210" height="135" rx="18" class="card"/>
    <circle cx="72" cy="170" r="22" fill="#f0883e" opacity=".18"/>
    <path d="M72 153v25a12 12 0 1 1-8 0v-25a4 4 0 0 1 8 0z" stroke="#f0883e" stroke-width="3" fill="none"/>
    <text x="105" y="164" class="txt" font-size="18" font-weight="700">Sensor 1</text>
    <text x="105" y="185" class="muted" font-size="13">Measurement point 1</text>
    <text x="55" y="225" class="txt" font-size="14">Temperature • Humidity</text>
    <rect x="55" y="238" width="150" height="5" rx="2.5" fill="#f0883e" opacity=".7"/>
  </g>

  <!-- Sensor 2 -->
  <g>
    <rect x="35" y="310" width="210" height="135" rx="18" class="card"/>
    <circle cx="72" cy="350" r="22" fill="#58a6ff" opacity=".18"/>
    <path d="M62 345c6-13 16-13 22 0c6 12-2 23-11 23s-17-11-11-23z" stroke="#58a6ff" stroke-width="3" fill="none"/>
    <text x="105" y="344" class="txt" font-size="18" font-weight="700">Sensor 2</text>
    <text x="105" y="365" class="muted" font-size="13">Measurement point 2</text>
    <text x="55" y="405" class="txt" font-size="14">Temperature • Humidity</text>
    <rect x="55" y="418" width="150" height="5" rx="2.5" fill="#58a6ff" opacity=".7"/>
  </g>

  <!-- ESP8266 -->
  <g>
    <rect x="325" y="170" width="175" height="175" rx="20" class="card"/>
    <rect x="355" y="195" width="115" height="92" rx="10" fill="#0d1117" stroke="#8b949e" stroke-width="2"/>
    <g stroke="#8b949e" stroke-width="2">
      <path d="M345 207h10M345 224h10M345 241h10M345 258h10M345 275h10"/>
      <path d="M470 207h10M470 224h10M470 241h10M470 258h10M470 275h10"/>
    </g>
    <path d="M386 225q27-25 54 0M395 236q18-16 36 0M405 247q8-7 16 0" stroke="#3fb950" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="413" cy="257" r="4" fill="#3fb950"/>
    <text x="412" y="313" text-anchor="middle" class="txt" font-size="19" font-weight="700">ESP8266</text>
    <text x="412" y="332" text-anchor="middle" class="muted" font-size="12">read • validate • upload</text>
  </g>

  <!-- Wi-Fi -->
  <g>
    <rect x="555" y="185" width="140" height="145" rx="20" class="card"/>
    <text x="625" y="215" text-anchor="middle" class="txt" font-size="18" font-weight="700">Wi-Fi</text>
    <path d="M585 245q40-36 80 0M596 258q29-25 58 0M607 271q18-15 36 0M620 284q5-4 10 0"
          stroke="#3fb950" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="625" cy="294" r="4" fill="#3fb950"/>
    <text x="625" y="317" text-anchor="middle" class="txt" font-size="14" font-weight="700">2.4 GHz band</text>
  </g>

  <!-- Google Sheets -->
  <g>
    <rect x="760" y="165" width="170" height="185" rx="20" class="card"/>
    <rect x="805" y="192" width="80" height="96" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="3"/>
    <path d="M825 192v96M845 192v96M865 192v96M805 216h80M805 240h80M805 264h80"
          stroke="#3fb950" stroke-width="1.5" opacity=".75"/>
    <text x="845" y="315" text-anchor="middle" class="txt" font-size="18" font-weight="700">Google Sheets</text>
    <text x="845" y="335" text-anchor="middle" class="muted" font-size="12">via Google Apps Script</text>
  </g>

  <!-- Charts -->
  <g>
    <rect x="970" y="145" width="195" height="225" rx="20" class="card"/>
    <text x="1067" y="175" text-anchor="middle" class="txt" font-size="18" font-weight="700">Charts</text>

    <line x1="990" y1="260" x2="1140" y2="260" stroke="#30363d"/>
    <line x1="990" y1="198" x2="990" y2="260" stroke="#30363d"/>
    <path d="M990 248 C1010 232 1024 238 1042 215 S1075 210 1092 226 S1120 205 1140 197 L1140 260 L990 260 Z" fill="url(#tempFill)"/>
    <path d="M990 248 C1010 232 1024 238 1042 215 S1075 210 1092 226 S1120 205 1140 197" stroke="#f0883e" stroke-width="3" fill="none"/>
    <text x="1065" y="278" text-anchor="middle" class="muted" font-size="12">Temperature</text>

    <line x1="990" y1="343" x2="1140" y2="343" stroke="#30363d"/>
    <line x1="990" y1="290" x2="990" y2="343" stroke="#30363d"/>
    <path d="M990 332 C1012 313 1026 322 1044 305 S1073 313 1093 296 S1123 309 1140 292 L1140 343 L990 343 Z" fill="url(#humFill)"/>
    <path d="M990 332 C1012 313 1026 322 1044 305 S1073 313 1093 296 S1123 309 1140 292" stroke="#58a6ff" stroke-width="3" fill="none"/>
    <text x="1065" y="360" text-anchor="middle" class="muted" font-size="12">Humidity</text>
  </g>

  <!-- Data flow footer -->
  <g>
    <rect x="300" y="420" width="665" height="90" rx="16" class="card"/>
    <text x="325" y="448" class="muted" font-size="12" font-weight="700">DATA FLOW</text>
    <text x="325" y="480" class="txt" font-size="14">Sensor readings</text>
    <text x="445" y="480" class="muted" font-size="16">→</text>
    <text x="475" y="480" class="txt" font-size="14">ESP8266</text>
    <text x="548" y="480" class="muted" font-size="16">→</text>
    <text x="578" y="480" class="txt" font-size="14">2.4 GHz Wi-Fi</text>
    <text x="680" y="480" class="muted" font-size="16">→</text>
    <text x="710" y="480" class="txt" font-size="14">Google Sheets</text>
    <text x="810" y="480" class="muted" font-size="16">→</text>
    <text x="840" y="480" class="txt" font-size="14">Charts</text>
  </g>

  <text x="600" y="540" text-anchor="middle" class="muted" font-size="12">
    ESP8266 two-sensor temperature &amp; humidity logger
  </text>
</svg>
